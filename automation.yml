# automation.yml: every script, workflow, hook and scheduled job in this repo, one entry each.
# Format: git-checker "Automation registry".
generated_patterns: ["**/*.checks.json", "**/*_report.json", "**/*.pdf", "**/*.html"]
ignore: ["reference/**"]
handmade: ["docs/**"]          # BOM spreadsheet and other hand-made docs
automations:
  - id: board-a-build
    script: tools/build_board_a.ps1
    helpers: [tools/sch_swap_board_a.py, tools/sch_repin_board_a.py, tools/pcb_swap_board_a.py, tools/route_board_a.py,
              tools/sch_inputs_board_a.py, tools/pcb_inputs_board_a.py, tools/pcb_rework.py,
              tools/sch_board_fix.py, tools/pcb_fix_board_a.py, tools/board_fix_pcb.py, tools/netlist_pins.py,
              tools/sch_board_power.py, tools/pcb_board_power.py, tools/sch_digikey.py, tools/pcb_digikey.py,
              tools/sch_tp_orphans.py, tools/sch_bom_fields.py, tools/pcb_bom_fields.py, tools/pcb_hole_keepout.py,
              tools/d2_tvs.py, tools/hw_protect.py, tools/hw_5v_module.py, tools/pcb_stackup.py, tools/copper_order.py,
              tools/drc_erc_waivers.py, tools/tlv_unused.py]
    trigger: manual
    reads: ["tools/*_board_a.py"]   # plus the baseline commit 542b3b9 of hardware/board-a
    writes: ["hardware/board-a/*.kicad_sch", hardware/board-a/DingoPDM.kicad_pcb]
    committed: yes
    auto_commit: false
    enabled: true
    run_cmd: powershell -File tools/build_board_a.ps1
    slow: true
    check_cmd: kicad-cli pcb drc --schematic-parity hardware/board-a/DingoPDM.kicad_pcb
    owner: claude
  - id: input-board-build
    script: tools/build_input_board.ps1
    helpers: [tools/gen_input_board_sch.py, tools/gen_input_board_pcb.py, tools/route_board_a.py, tools/pcb_rework.py,
              tools/sch_bom_fields.py, tools/pcb_bom_fields.py, tools/pcb_models_input_board.py, tools/board_fix_pcb.py,
              tools/drc_erc_waivers.py]
    trigger: manual
    reads: ["tools/gen_input_board_*.py", hardware/input-board/Models/430451200.stp]
    writes: [hardware/input-board/input-board.kicad_sch, hardware/input-board/input-board.kicad_pcb]
    committed: yes
    auto_commit: false
    enabled: true
    run_cmd: powershell -File tools/build_input_board.ps1
    slow: true
    check_cmd: kicad-cli pcb drc --schematic-parity hardware/input-board/input-board.kicad_pcb
    owner: claude
  - id: board-b-build
    script: tools/build_board_b.ps1
    helpers: [tools/sch_board_b.py, tools/pcb_board_b.py, tools/route_board_b.py, tools/tidy_board_b.py, tools/board_b_geom.py, tools/check_board_b.py, tools/netlist_pins.py,
              tools/sch_board_fix.py, tools/board_fix_pcb.py, tools/sch_board_power.py, tools/pcb_board_power.py,
              tools/sch_digikey.py, tools/pcb_digikey.py, tools/sch_bom_fields.py, tools/pcb_bom_fields.py, tools/pcb_hole_keepout.py,
              tools/d2_tvs.py, tools/hw_protect.py, tools/hw_5v_module.py, tools/drc_erc_waivers.py]
    trigger: manual
    reads: [tools/sch_board_b.py, tools/pcb_board_b.py, tools/route_board_b.py, tools/tidy_board_b.py, tools/check_board_b.py,
            tools/pcb_feed_board_b.py, tools/pcb_stackup.py, tools/copper_order.py, tools/pcb_models_board_b.py, tools/tsdso24_model.py]   # + baseline fe19c28 of hardware/board-b-max; not thermal_board_b.py (own entry, never run by the build)
    writes: ["hardware/board-b-max/*.kicad_sch", "hardware/board-b-max/*.kicad_pcb"]
    committed: yes
    auto_commit: false
    enabled: true
    run_cmd: powershell -File tools/build_board_b.ps1
    slow: true
    check_cmd: python tools/check_board_b.py <netlist>
    owner: claude
  - id: fab-jlcpcb
    script: tools/gen_fab_jlcpcb.py
    trigger: manual
    reads: [hardware/board-a/DingoPDM.kicad_pcb, hardware/board-b-max/dingoPDM-Max.kicad_pcb, hardware/input-board/input-board.kicad_pcb]
    writes: ["hardware/fab/*/gerber/*", "hardware/fab/*/*.csv", "hardware/fab/*/fab-notes.md", "hardware/fab/*/jlcpcb-drc.txt"]   # plus hardware/fab/*/*-gerber.zip (git-ignored)
    committed: yes
    auto_commit: false
    enabled: true
    run_cmd: '"%LOCALAPPDATA%\Programs\KiCad\9.0\bin\python.exe" tools/gen_fab_jlcpcb.py [A] [B] [IN]'   # KiCad 9 python + kicad-cli 10
    slow: true
    check_cmd: git diff --exit-code hardware/fab   # a re-run on unchanged boards writes identical files
    owner: claude
  - id: connector-maps
    script: tools/gen_connector_maps.py
    trigger: manual
    reads: []                       # tables are typed into the script by hand
    writes: [docs/diagrams/board-connectors.svg, docs/diagrams/enclosure-connectors.svg, docs/diagrams/system-wiring.svg]   # illustrations only, not a source of truth
    committed: yes
    auto_commit: false
    enabled: true
    run_cmd: python tools/gen_connector_maps.py
    owner: claude
  - id: drc-diff
    script: tools/drc_diff.py
    trigger: manual
    reads: ["kicad-cli DRC JSON reports"]
    writes: []                      # prints counts to the console
    committed: yes
    auto_commit: false
    enabled: true
    run_cmd: python tools/drc_diff.py <baseline.json> <new.json> [type ...]
    owner: claude
  - id: drc-erc-waivers
    script: tools/drc_erc_waivers.py
    trigger: manual                 # also the last stage of build_board_a.ps1 / build_board_b.ps1 / build_input_board.ps1
    # Modifies in place (does not produce) hardware/*/*.kicad_sch and *.kicad_pro, and reads the *.kicad_pcb: those
    # files are produced by board-a-build / board-b-build / input-board-build (this script is their last stage), so
    # their freshness is checked on those entries. The registry has no 'modifies' field: listing them in writes made
    # DUPLICATE-OUTPUT, listing them in reads made a false STALE-OUTPUT (each board rebuild re-runs this stage; the
    # --check below proves nothing would change). Edits: ERC / DRC exclusions with reasons (.kicad_pro), parity
    # Datasheet fields and duplicate sheet UUIDs (.kicad_sch); never the .kicad_pcb.
    reads: []
    writes: ["hardware/*/*.kicad_dru"]   # custom rules with reasons (produced by this script)
    committed: yes
    auto_commit: false
    enabled: true
    run_cmd: python tools/drc_erc_waivers.py A|B|IN   # kicad-cli 10; docs/drc-erc-review.md
    slow: true
    check_cmd: python tools/drc_erc_waivers.py A --check   # same for B, IN: exit 1 on an unwaived DRC / ERC item or a file that would change
    owner: claude
  - id: pcb-info
    script: tools/pcb_info.py
    trigger: manual
    reads: ["**/*.kicad_pcb"]
    writes: []                      # prints a board summary to the console
    committed: yes
    auto_commit: false
    enabled: true
    run_cmd: python.exe tools/pcb_info.py <board.kicad_pcb> [ref ...]   # KiCad 9 python
    owner: claude
  - id: parts-audit-csv
    script: tools/gen_parts_audit_csv.py
    trigger: manual
    reads: ["hardware/board-a/*.kicad_sch", "hardware/board-b-max/*.kicad_sch", "hardware/input-board/*.kicad_sch"]   # plus the old CSV (LCSC / Mouser / Digi-Key data carried over); LCSC read on lcsc.com; Mouser / Digi-Key from a --dist TSV read on trustedparts.com in a browser (docs/parts-audit.md 18)
    writes: [docs/parts-audit.csv]
    committed: yes
    auto_commit: false
    enabled: true
    run_cmd: python tools/gen_parts_audit_csv.py [--offline] [--refresh-lcsc] [--dist TSV --over TSV] [--date D]; python tools/gen_parts_audit_csv.py --set-cost   # uses KiCad 10 kicad-cli
    slow: true
    owner: claude
  - id: firmware-port
    script: firmware/tools_custom/port_boards.py
    trigger: manual
    reads: [firmware/boards/dingopdm_v7, firmware/boards/dingopdmmax_v1, docs/firmware-pin-map.md]   # pin map is read by a person, values are in the script
    writes: [firmware/boards/custompdm_a, firmware/boards/custompdm_b]
    committed: yes
    auto_commit: false
    enabled: true
    run_cmd: python3 firmware/tools_custom/port_boards.py firmware
    check_cmd: make -C firmware BOARD=custompdm_a UNIT=1   # needs firmware/ChibiOS and arm-none-eabi-gcc (WSL sandbox ~/renode-pdm)
    owner: claude
  - id: firmware-sim
    script: firmware/sim/build.sh
    helpers: [firmware/sim/pdmsim.py, firmware/sim/s0_board_audit.py, firmware/sim/s1_system.py, firmware/sim/s2_boot_blip.py, firmware/sim/s3_features.py, firmware/sim/s4_can_system.py, firmware/sim/sim_core.cpp]   # s4 = presim item 5
    trigger: manual
    reads: ["firmware/**"]
    writes: []                      # builds to an output folder outside the repo (e.g. /tmp/simout)
    committed: yes
    auto_commit: false
    enabled: true
    run_cmd: firmware/sim/build.sh custompdm_a /tmp/simout 1   # Linux / WSL, g++; then python3 firmware/sim/s0_board_audit.py /tmp/simout
    owner: claude
  - id: firmware-drive-cycle
    script: firmware/sim/s5_drive_cycle.py
    helpers: [tools/presim_parts.py]   # loads (CAR_LOADS) and RDS(ON); pdmsim.py is listed under firmware-sim
    trigger: manual
    reads: [firmware/sim/data/st185-starter.params.dummy.tsv, tools/presim_parts.py]
    writes: [firmware/sim/data/s5_board_power.csv]   # copied from the run's --out folder (also s5_current_trace.csv, s5_edges.json: not committed)
    committed: yes
    auto_commit: false
    enabled: true
    run_cmd: python3 firmware/sim/s5_drive_cycle.py /tmp/simout --out /tmp/s5   # after firmware/sim/build.sh x 3; 34 of 34; --mutants: 16 of 16 RED
    slow: true
    owner: claude
  - id: firmware-car-cycle
    script: firmware/sim/s5_car_cycle.py
    helpers: [tools/presim_parts.py]   # carsim (2026-11-23): the full-PDM ST185 car config day; pdmsim.py is listed under firmware-sim
    trigger: manual
    reads: [firmware/sim/data/st185-car.params.dummy.tsv, docs/car-can-dummy/bus-load.dummy.md]
    writes: [firmware/sim/data/s5_car_board_power.dummy.csv, firmware/sim/data/s5_car_currents.dummy.json]   # copied from the run's --out folder (s5_car_board_power.csv, s5_car_currents.dummy.json); the trace is not committed
    committed: yes
    auto_commit: false
    enabled: true
    run_cmd: python3 firmware/sim/s5_car_cycle.py /tmp/simout --out /tmp/s5car   # after firmware/sim/build.sh x 3; 32 of 32; --mutants: 13 of 13 RED
    slow: true
    owner: claude
  - id: harness-cost-study
    script: tools/harness_cost_study.py
    trigger: manual
    reads: [harness/enclosure-wire-list.csv]   # + a read-only clone of st185-link-ecu-config (--st185): MASTER-wirelist.csv, its layout tree, PROJECT-BOM.csv, cad/fusebox/rev8/fusebox-parts-*.csv
    writes: [docs/harness-cost/breakpoint.dummy.csv, docs/harness-cost/routes.dummy.csv, docs/harness-cost/sleeving.dummy.csv, docs/harness-cost/parts.dummy.csv, docs/diagrams/harness-breakpoint.png]
    committed: yes
    auto_commit: false
    enabled: true
    run_cmd: python tools/harness_cost_study.py --st185 <clone of st185-link-ecu-config>   # harnesscost 2026-11-23, st185 @ e047a17; docs/pdm-vs-relays.md quotes its numbers
    owner: claude
  - id: starter-params
    script: ui/tests/CustomPdm.Tests/StarterParamsExportTests.cs
    trigger: manual
    reads: [ui/examples/st185-starter.json]
    writes: [firmware/sim/data/st185-starter.params.dummy.tsv]
    committed: yes
    auto_commit: false
    enabled: true
    run_cmd: $env:CUSTOMPDM_WRITE_STARTER_PARAMS='1'; dotnet test ui\tests\CustomPdm.Tests --filter StarterParamsExportTests   # without the variable it only checks the file
    slow: true
    owner: claude
  - id: renode-sandbox
    script: firmware/sim/renode/install_wsl.sh
    helpers: [firmware/sim/renode/check_wsl.sh, firmware/sim/renode/build_wsl.sh]
    trigger: manual
    reads: ["firmware/**"]
    writes: []                      # everything goes to ~/renode-pdm inside WSL
    committed: yes
    auto_commit: false
    enabled: true
    run_cmd: wsl -d Ubuntu -- bash firmware/sim/renode/install_wsl.sh   # strip CR first if checked out with CRLF
    owner: claude
  - id: dbc-gen
    script: ui/tools/DbcGen/Program.cs
    helpers: [ui/tools/DbcGen/DbcGen.csproj, ui/dingoConfig/domain/CustomPdm/DbcExport.cs]   # same generator as the /pdm Export DBC button
    trigger: manual
    reads: ["ui/dingoConfig/web/Definitions/custompdm-*-signals.json", ui/dingoConfig/web/Definitions/device-definitions.json]
    writes: [firmware/dbc/custompdm_A1_0x500.dbc, firmware/dbc/custompdm_A2_0x540.dbc, firmware/dbc/custompdm_B_0x580.dbc, firmware/dbc/custompdm_PDM.dbc]
    committed: yes
    auto_commit: false
    enabled: true
    run_cmd: dotnet run --project ui/tools/DbcGen
    slow: true
    check_cmd: dotnet run --project ui/tools/DbcGen -- --check   # also ui/tests DbcExportTests.RepoFilesEqualGenerator
    owner: claude
  - id: car-can-dummy
    script: ui/tools/CarCanDummy/DummyFiles.cs
    helpers: [ui/tools/CarCanDummy/CarCanDummy.csproj, ui/tools/CarCanDummy/LinkPdmDummy.cs, ui/tools/CarCanDummy/CanIdTableDummy.cs, ui/tools/CarCanDummy/BusLoadDummy.cs, ui/tools/CarCanDummy/DummySources.cs]   # DUMMY TEST COPIES (Dan, 2026-11-16: L1a, L2, L3a); BusLoadDummy = the bus-load script
    trigger: manual
    reads: [docs/car-can-dummy/can-id-table.dummy.md, ui/dingoConfig/domain/CustomPdm/DbcExport.cs]   # the ID table is hand made from st185 (read only)
    writes: [docs/car-can-dummy/link_pdm_receive.dummy.json, docs/car-can-dummy/link_pdm_receive.dummy.lcs, docs/car-can-dummy/bus-load.dummy.md]
    committed: yes
    auto_commit: false
    enabled: true
    run_cmd: dotnet run --project ui/tools/DbcGen   # same run as dbc-gen; exits 1 on an ID clash in the dummy table
    slow: true
    check_cmd: dotnet run --project ui/tools/DbcGen -- --check   # also ui/tests CarCanDummyTests, LinkDummyTests, BusLoadDummyTests
    owner: claude
  - id: st185-car-config
    script: ui/tests/CustomPdm.Tests/St185CarTests.cs
    helpers: [ui/dingoConfig/application/Services/PdmStarter.cs]   # carconfig (Dan c4 = a, 2026-11-23): the car map St185Car builds the file on a New PDM
    trigger: manual
    reads: [ui/dingoConfig/domain/CustomPdm/PdmFactoryDefaults.cs]   # the New PDM it starts from; the map is a dummy copy of st185-link-ecu-config @ 839be705 (read only)
    writes: [ui/examples/st185-car.dummy.json, firmware/sim/data/st185-car.params.dummy.tsv]   # carsim: DUMMY / demo car config + its wire values for s5 car
    committed: yes
    auto_commit: false
    enabled: true
    run_cmd: powershell -Command "$env:CUSTOMPDM_WRITE_CAR_CONFIG='1'; dotnet test ui\tests\CustomPdm.Tests --filter St185CarTests"
    slow: true
    check_cmd: dotnet test ui\tests\CustomPdm.Tests --filter St185CarTests   # TheCarFileIsWhatTheMapBuilds, TheDocTableIsTheMap
    owner: claude
  - id: ui-launcher
    script: ui/Start-PdmUi.ps1
    helpers: ["ui/Start PDM UI.cmd", ui/tests/sim_bridge.py, firmware/sim/build.sh]   # the .cmd is the double-click entry; Desktop shortcut "PDM UI.lnk" points at it
    trigger: manual                 # Dan's one-click start (2026-11-21)
    reads: ["firmware/**", "ui/dingoConfig/**"]   # sim built from a git archive of main in WSL (/home/daniel/scratch/ui-play)
    writes: []                      # pid file + build .sh in %LOCALAPPDATA%\custom-pdm; Desktop shortcut with -InstallShortcut (not in git)
    committed: yes
    auto_commit: false
    enabled: true
    run_cmd: powershell -ExecutionPolicy Bypass -File ui\Start-PdmUi.ps1 [-Stop] [-NoSim] [-Rebuild] [-InstallShortcut]
    check_cmd: powershell -ExecutionPolicy Bypass -File ui\Start-PdmUi.ps1 -SelfTest
    owner: claude
  - id: state-check
    script: .github/workflows/state-check.yml
    helpers: [.github/state-check.sh, .github/registry-check.py]
    trigger: pr-check
    reads: ["**"]
    writes: []
    committed: yes
    auto_commit: false
    enabled: true                   # GitHub CI; runs on every PR (private remote since 2026-11-10)
    owner: claude
  - id: no-claude-files
    script: .github/workflows/no-claude-files.yml
    helpers: [.github/no-claude-files.sh]
    trigger: pr-check
    reads: ["**"]
    writes: []
    committed: yes
    auto_commit: false
    enabled: false                  # GitHub only; same as state-check
    owner: claude
  - id: state-files-gate
    script: .github/workflows/state-files-gate.yml
    helpers: [.github/state-files-gate.sh]   # copied as-is from workstation origin/main (PR #114, 62b9124)
    trigger: pr-check
    reads: [the git tree of the PR merge ref]
    writes: []
    committed: yes
    auto_commit: false
    enabled: true                   # blocks a PR that leaves a top-level STATE-*.md (no label escape)
    run_cmd: bash .github/state-files-gate.sh HEAD
    owner: claude
  - id: enclosure-v2c-build
    script: enclosure/v2c/src/build_check_all.sh
    helpers: [enclosure/v2c/src/run.sh, enclosure/v2c/src/build_v2c.py, enclosure/v2c/src/clearance_v2c.py, enclosure/v2c/src/show_check.py,
              enclosure/v2c/src/inspect_vendor.py, enclosure/v2c/src/bg.sh, enclosure/v2c/src/bbox_parts.py,
              enclosure/v2c/src/mass_v2c.py, enclosure/v2c/src/screwtool_twin.py, enclosure/v2c/src/lugcheck_v2c.py,
              enclosure/v2c/src/bomcheck_v2c.py, enclosure/v2c/src/cnc_v2c.sh, enclosure/v2c/src/export_boards.ps1,
              enclosure/v2c/src/compare_v2b.py, enclosure/v2c/src/drawings_v2c.py, enclosure/v2c/src/fusion_v2c.py,
              enclosure/v2c/src/asm_drawing_v2c.py, enclosure/v2c/src/harness_paths_v2c.py, enclosure/v2c/src/wirecheck_v2c.py,
              enclosure/v2c/src/access_v2c.py, enclosure/v2c/src/harness_comb_v2c.py, enclosure/v2c/src/harness_loom_data.py]
    trigger: manual
    reads: ["enclosure/v2c/src/*.py", "hardware/*/*.kicad_pcb", "harness/enclosure-wire-list.csv", "harness/src/enclosure_harness.py"]   # plus board / vendor STEPs in <repo root>/.claude/cache/enclosure (not in git, see enclosure/v2c/vendor/README.md)
    writes: []                      # STEP/BREP/meta/check JSON go to WSL ~/scratch/encl-v2c/runs (not in git); `harness_paths_v2c.py lengths <run>/F1/harness_paths.json --write` (by hand) fills TBD lengths in harness/enclosure-wire-list.csv
    committed: yes
    auto_commit: false
    enabled: true
    run_cmd: wsl -e bash -c "tr -d '\015' < enclosure/v2c/src/build_check_all.sh > /tmp/bca.sh && HERE=$PWD/enclosure/v2c/src bash /tmp/bca.sh F1"   # WSL path of the checkout; board STEPs first: powershell -File enclosure\v2c\src\export_boards.ps1
    check_cmd: wsl -e bash enclosure/v2c/src/run.sh show_check.py F1
    owner: claude
  - id: enclosure-v2c-render
    script: enclosure/v2c/src/render_v2c.py
    trigger: manual
    reads: ["~/scratch/encl-v2c/runs/*/brep/*.brep"]   # output of enclosure-v2c-build
    writes: ["docs/diagrams/enclosure-v2c-*.png"]      # illustration only; copied from ~/scratch/encl-v2c/renders
    committed: yes
    auto_commit: false
    enabled: true
    run_cmd: wsl -e bash -c "bash enclosure/v2c/src/run.sh render_v2c.py F1 iso front"   # views as args
    slow: true
    owner: claude
  - id: heat-sim
    script: sim/heat/run_cases.py
    helpers: [sim/heat/geometry.py, sim/heat/mesh_heat.py, sim/heat/convection.py, sim/heat/make_report.py, sim/heat/report_revf.py]
    trigger: manual
    reads: ["sim/heat/*.py", sim/heat/loads_revF.json]   # HEAT_GEOM env: "" = Grok TEST 2 sink, v2b-F1 / v2b-F2 = enclosure v2b, revF = current enclosure (docs/heat-analysis.md 2026-11-23)
    writes: ["docs/diagrams/heat-*.png", sim/heat/example_worst_fans_k3.sif]
    committed: yes
    auto_commit: false
    enabled: true
    run_cmd: wsl -e bash -c "export HEAT_GEOM=revF; python3 -I sim/heat/mesh_heat.py ~/cad-parts/custom-pdm-thermal3/runs/m2 0.6 && ~/.venvs/handbuilt-cad/bin/python -I sim/heat/run_cases.py ~/cad-parts/custom-pdm-thermal3/runs/m2 && ~/.venvs/handbuilt-cad/bin/python -I sim/heat/report_revf.py ~/cad-parts/custom-pdm-thermal3/runs/m2 docs/diagrams"
    slow: true
    owner: claude
  - id: heat-sim-loads
    script: sim/heat/make_loads.py
    trigger: manual                 # after the board models change: their fans-on JSONs feed the whole-box model
    reads: [tools/thermal_a.py, tools/thermal_board_b.py]
    writes: [sim/heat/loads_revF.json]
    committed: yes
    auto_commit: false
    enabled: true
    run_cmd: python sim/heat/make_loads.py <thermal_a fans JSON> <thermal_board_b fans JSON (--case feed150 car rating)>
    slow: true
    owner: claude
  - id: pcb-thermal-board-a
    script: tools/thermal_a.py
    helpers: [tools/test_thermal_models.py]
    trigger: manual                 # after any board A change (docs/heat-analysis.md); tests: tools/test_thermal_models.py
    reads: [hardware/board-a/DingoPDM.kicad_pcb, firmware/sim/data/s5_board_power.csv]   # s5: case drive (hwtemp)
    writes: ["docs/diagrams/thermal-board-a-*.png"]   # only with --plots
    committed: yes
    auto_commit: false
    enabled: true
    run_cmd: '"%LOCALAPPDATA%\Programs\KiCad\9.0\bin\python.exe" tools/thermal_a.py [--air fans|nofan] [--plots docs/diagrams]'
    slow: true
    owner: claude
  - id: pcb-thermal-input-board
    script: tools/thermal_input.py
    trigger: manual                 # after any input-board change (docs/heat-analysis.md)
    reads: [hardware/input-board/input-board.kicad_pcb]
    writes: ["docs/diagrams/thermal-board-in-*.png"]   # only with --plots
    committed: yes
