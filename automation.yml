# automation.yml: every script, workflow, hook and scheduled job in this repo, one entry each.
# Format: git-checker "Automation registry".
generated_patterns: ["**/*.checks.json", "**/*_report.json", "**/*.pdf", "**/*.html"]
ignore: ["reference/**"]
handmade: ["docs/**"]          # BOM spreadsheet and other hand-made docs
automations:
  - id: board-a-build
    script: tools/build_board_a.ps1
    helpers: [tools/sch_swap_board_a.py, tools/sch_repin_board_a.py, tools/pcb_swap_board_a.py, tools/route_board_a.py,
              tools/sch_inputs_board_a.py, tools/pcb_inputs_board_a.py, tools/pcb_rework.py,
              tools/sch_board_fix.py, tools/pcb_fix_board_a.py, tools/board_fix_pcb.py, tools/netlist_pins.py]
    trigger: manual
    reads: ["tools/*_board_a.py"]   # plus the baseline commit 542b3b9 of hardware/board-a
    writes: ["hardware/board-a/*.kicad_sch", hardware/board-a/DingoPDM.kicad_pcb]
    committed: yes
    auto_commit: false
    enabled: true
    run_cmd: powershell -File tools/build_board_a.ps1
    check_cmd: kicad-cli pcb drc --schematic-parity hardware/board-a/DingoPDM.kicad_pcb
    owner: claude
  - id: input-board-build
    script: tools/build_input_board.ps1
    helpers: [tools/gen_input_board_sch.py, tools/gen_input_board_pcb.py, tools/route_board_a.py, tools/pcb_rework.py]
    trigger: manual
    reads: ["tools/gen_input_board_*.py"]
    writes: [hardware/input-board/input-board.kicad_sch, hardware/input-board/input-board.kicad_pcb]
    committed: yes
    auto_commit: false
    enabled: true
    run_cmd: powershell -File tools/build_input_board.ps1
    check_cmd: kicad-cli pcb drc --schematic-parity hardware/input-board/input-board.kicad_pcb
    owner: claude
  - id: board-b-build
    script: tools/build_board_b.ps1
    helpers: [tools/sch_board_b.py, tools/pcb_board_b.py, tools/route_board_b.py, tools/tidy_board_b.py, tools/board_b_geom.py, tools/check_board_b.py, tools/netlist_pins.py,
              tools/sch_board_fix.py, tools/board_fix_pcb.py]
    trigger: manual
    reads: ["tools/*_board_b.py"]   # plus the baseline commit fe19c28 of hardware/board-b-max
    writes: ["hardware/board-b-max/*.kicad_sch", "hardware/board-b-max/*.kicad_pcb"]
    committed: yes
    auto_commit: false
    enabled: true
    run_cmd: powershell -File tools/build_board_b.ps1
    check_cmd: python tools/check_board_b.py <netlist>
    owner: claude
  - id: connector-maps
    script: tools/gen_connector_maps.py
    trigger: manual
    reads: []                       # tables are typed into the script by hand
    writes: [docs/diagrams/board-connectors.svg, docs/diagrams/enclosure-connectors.svg, docs/diagrams/system-wiring.svg]   # illustrations only, not a source of truth
    committed: yes
    auto_commit: false
    enabled: true
    run_cmd: python tools/gen_connector_maps.py
    owner: claude
  - id: drc-diff
    script: tools/drc_diff.py
    trigger: manual
    reads: ["kicad-cli DRC JSON reports"]
    writes: []                      # prints counts to the console
    committed: yes
    auto_commit: false
    enabled: true
    run_cmd: python tools/drc_diff.py <baseline.json> <new.json> [type ...]
    owner: claude
  - id: pcb-info
    script: tools/pcb_info.py
    trigger: manual
    reads: ["**/*.kicad_pcb"]
    writes: []                      # prints a board summary to the console
    committed: yes
    auto_commit: false
    enabled: true
    run_cmd: python.exe tools/pcb_info.py <board.kicad_pcb> [ref ...]   # KiCad 9 python
    owner: claude
  - id: parts-audit-csv
    script: tools/gen_parts_audit_csv.py
    trigger: manual
    reads: ["hardware/board-a/*.kicad_sch", "hardware/board-b-max/*.kicad_sch", "hardware/input-board/*.kicad_sch"]   # plus the old CSV (LCSC stock/price carried over); new LCSC numbers looked up on lcsc.com
    writes: [docs/parts-audit.csv]
    committed: yes
    auto_commit: false
    enabled: true
    run_cmd: python tools/gen_parts_audit_csv.py [--offline]   # uses KiCad 10 kicad-cli
    owner: claude
  - id: firmware-port
    script: firmware/tools_custom/port_boards.py
    trigger: manual
    reads: [firmware/boards/dingopdm_v7, firmware/boards/dingopdmmax_v1, docs/firmware-pin-map.md]   # pin map is read by a person, values are in the script
    writes: [firmware/boards/custompdm_a, firmware/boards/custompdm_b]
    committed: yes
    auto_commit: false
    enabled: true
    run_cmd: python3 firmware/tools_custom/port_boards.py firmware
    check_cmd: make -C firmware BOARD=custompdm_a UNIT=1   # needs firmware/ChibiOS and arm-none-eabi-gcc (WSL sandbox ~/renode-pdm)
    owner: claude
  - id: firmware-sim
    script: firmware/sim/build.sh
    helpers: [firmware/sim/pdmsim.py, firmware/sim/s0_board_audit.py, firmware/sim/s1_system.py, firmware/sim/s2_boot_blip.py, firmware/sim/sim_core.cpp]
    trigger: manual
    reads: ["firmware/**"]
    writes: []                      # builds to an output folder outside the repo (e.g. /tmp/simout)
    committed: yes
    auto_commit: false
    enabled: true
    run_cmd: firmware/sim/build.sh custompdm_a /tmp/simout 1   # Linux / WSL, g++; then python3 firmware/sim/s0_board_audit.py /tmp/simout
    owner: claude
  - id: renode-sandbox
    script: firmware/sim/renode/install_wsl.sh
    helpers: [firmware/sim/renode/check_wsl.sh, firmware/sim/renode/build_wsl.sh]
    trigger: manual
    reads: ["firmware/**"]
    writes: []                      # everything goes to ~/renode-pdm inside WSL
    committed: yes
    auto_commit: false
    enabled: true
    run_cmd: wsl -d Ubuntu -- bash firmware/sim/renode/install_wsl.sh   # strip CR first if checked out with CRLF
    owner: claude
  - id: state-check
    script: .github/workflows/state-check.yml
    helpers: [.github/state-check.sh, .github/registry-check.py]
    trigger: pr-check
    reads: ["**"]
    writes: []
    committed: yes
    auto_commit: false
    enabled: false                  # GitHub only; the repo is local-only since 2026-11-09
    owner: claude
  - id: enclosure-v2b-build
    script: enclosure/v2b/src/build_check_all.sh
    helpers: [enclosure/v2b/src/run.sh, enclosure/v2b/src/build_v2b.py, enclosure/v2b/src/clearance_v2b.py, enclosure/v2b/src/show_check.py,
              enclosure/v2b/src/inspect_vendor.py, enclosure/v2b/src/bg.sh, enclosure/v2b/src/bbox_parts.py,
              enclosure/v2b/src/mass_v2b.py, enclosure/v2b/src/screwtool_twin.py, enclosure/v2b/src/lugcheck_v2b.py]
    trigger: manual
    reads: ["enclosure/v2b/src/*.py", "hardware/*/*.step"]   # plus Grok's pack copy and vendor STEPs in .claude/tmp (not in git)
    writes: []                      # STEP/BREP/meta/check.json go to WSL ~/scratch/encl-v2b/runs (not in git)
    committed: yes
    auto_commit: false
    enabled: true
    run_cmd: wsl -e bash -c "tr -d '\015' < enclosure/v2b/src/build_check_all.sh > /tmp/bca.sh && HERE=$PWD/enclosure/v2b/src bash /tmp/bca.sh F1 F2"   # WSL path of the checkout
    check_cmd: wsl -e bash enclosure/v2b/src/run.sh show_check.py F1
    owner: claude
  - id: enclosure-v2b-render
    script: enclosure/v2b/src/render_v2b.py
    trigger: manual
    reads: ["~/scratch/encl-v2b/runs/*/brep/*.brep"]   # output of enclosure-v2b-build
    writes: ["docs/diagrams/enclosure-v2b-*.png"]      # illustration only; copied from ~/scratch/encl-v2b/renders
    committed: yes
    auto_commit: false
    enabled: true
    run_cmd: wsl -e bash -c "CAD_HOME=~/projects/handbuilt-cad RENDER_DIR=~/scratch/encl-v2b/renders bash enclosure/v2b/src/run.sh render_v2b.py F1 iso front"   # views as args
    owner: claude
  - id: heat-sim
    script: sim/heat/run_cases.py
    helpers: [sim/heat/geometry.py, sim/heat/mesh_heat.py, sim/heat/convection.py, sim/heat/make_report.py]
    trigger: manual
    reads: ["sim/heat/*.py"]        # HEAT_GEOM env: "" = Grok TEST 2 sink, v2b-F1 / v2b-F2 = enclosure v2b variants
    writes: ["docs/diagrams/heat-*.png", sim/heat/example_worst_fans_k3.sif]
    committed: yes
    auto_commit: false
    enabled: true
    run_cmd: wsl -e bash -c "python3 -I sim/heat/mesh_heat.py ~/scratch/heat/runs/m2 0.6 && ~/.venvs/handbuilt-cad/bin/python -I sim/heat/run_cases.py ~/scratch/heat/runs/m2"
    owner: claude
