# automation.yml: every script, workflow, hook and scheduled job in this repo, one entry each.
# Format: git-checker "Automation registry".
generated_patterns: ["**/*.checks.json", "**/*_report.json", "**/*.pdf", "**/*.html"]
ignore: ["reference/**"]
handmade: ["docs/**"]          # BOM spreadsheet and other hand-made docs
automations:
  - id: board-a-build
    script: tools/build_board_a.ps1
    helpers: [tools/sch_swap_board_a.py, tools/sch_repin_board_a.py, tools/pcb_swap_board_a.py, tools/route_board_a.py,
              tools/sch_inputs_board_a.py, tools/pcb_inputs_board_a.py, tools/pcb_rework.py]
    trigger: manual
    reads: ["tools/*_board_a.py"]   # plus the baseline commit 542b3b9 of hardware/board-a
    writes: ["hardware/board-a/*.kicad_sch", hardware/board-a/DingoPDM.kicad_pcb]
    committed: yes
    auto_commit: false
    enabled: true
    run_cmd: powershell -File tools/build_board_a.ps1
    check_cmd: kicad-cli pcb drc --schematic-parity hardware/board-a/DingoPDM.kicad_pcb
    owner: claude
  - id: input-board-build
    script: tools/build_input_board.ps1
    helpers: [tools/gen_input_board_sch.py, tools/gen_input_board_pcb.py, tools/route_board_a.py, tools/pcb_rework.py]
    trigger: manual
    reads: ["tools/gen_input_board_*.py"]
    writes: [hardware/input-board/input-board.kicad_sch, hardware/input-board/input-board.kicad_pcb]
    committed: yes
    auto_commit: false
    enabled: true
    run_cmd: powershell -File tools/build_input_board.ps1
    check_cmd: kicad-cli pcb drc --schematic-parity hardware/input-board/input-board.kicad_pcb
    owner: claude
  - id: state-check
    script: .github/workflows/state-check.yml
    helpers: [.github/state-check.sh, .github/registry-check.py]
    trigger: pr-check
    reads: ["**"]
    writes: []
    committed: yes
    auto_commit: false
    enabled: true
    owner: claude
